# /etc/nginx/sites-available/lp.mingrow.com
#
# Reverse proxy for the Mingrow Studio app (Express on 127.0.0.1:3111).
# Install:
#   sudo cp deploy/nginx-lp.mingrow.com.conf /etc/nginx/sites-available/lp.mingrow.com
#   sudo ln -s /etc/nginx/sites-available/lp.mingrow.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lp.mingrow.com     # adds the TLS block for you

server {
    listen 80;
    listen [::]:80;
    # The bare IP lets you test before DNS points at the box. Drop it once
    # lp.mingrow.com resolves to 31.97.233.56 — certbot needs the domain.
    server_name lp.mingrow.com 31.97.233.56;

    # Let certbot manage the redirect to HTTPS after you run it.

    # Landing.mp4 is ~15 MB and browsers fetch it with Range requests.
    # Proxy buffering is disabled for it so seeking stays responsive.
    location = /Landing.mp4 {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Razorpay webhook: the signature is computed over the raw body, so nothing
    # here may rewrite or re-chunk it. Keep this block free of body-altering
    # directives (no sub_filter, no gzip on the request).
    location = /api/payments/webhook {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # JSON payloads here are tiny; keep the ceiling low.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Never gzip video — it is already compressed and it breaks Range handling.
    gzip_proxied any;

    access_log /var/log/nginx/lp.mingrow.com.access.log;
    error_log  /var/log/nginx/lp.mingrow.com.error.log;
}
