# Full local stack for the Mingrow Studio booking flow.
#
#   docker compose up -d --build     -> app on http://localhost:3000
#   docker compose --profile dev up  -> adds Vite + HMR on http://localhost:5173
#
# Credentials come from .env (never baked into the image). The DB container
# creates the database, the app user and the schema on first start, so no
# host MySQL/MariaDB and no sudo are required.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Root password is only used inside the container for healthchecks/admin.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mingrow_root_dev}
      MYSQL_DATABASE: ${DB_NAME:-mingrowspace}
      MYSQL_USER: ${DB_USER:-mingrowspace}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # 3307 on the host: your host MariaDB already owns 3306.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Runs only on first init (empty volume). See README note on re-seeding.
      - ./database/mysql_migration.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These override the host-oriented values in .env: inside the compose
      # network the database is reachable as "db" over plain TCP.
      DB_HOST: db
      DB_PORT: "3306"
      DB_SSL: "false"
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Optional: Vite dev server with hot reload, proxying /api to the api service.
  # Enable with: docker compose --profile dev up
  web:
    build: .
    profiles: ["dev"]
    command: npx vite --host 0.0.0.0 --port 5173
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      # Live-mount sources so edits hot-reload; node_modules stays in the image.
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js

volumes:
  db_data:
